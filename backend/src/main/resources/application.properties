spring.application.name=mytracker-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/MyTracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.openai.base-url=${AI_BASE_URL:http://localhost:1234}
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.chat.options.model=${AI_MODEL:local-model}
