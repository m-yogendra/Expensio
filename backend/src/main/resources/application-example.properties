spring.application.name=mytracker-backend
server.port=8080

# Database Configuration
# Replace with your actual MySQL database URL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/MyTracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# AI Configuration (LM Studio / OpenAI-compatible)
# Replace with your AI service URL and API key
spring.ai.openai.base-url=http://localhost:1234
spring.ai.openai.api-key=your_api_key_here
spring.ai.openai.chat.options.model=local-model
